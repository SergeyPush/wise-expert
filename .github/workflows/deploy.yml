name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git checkout -- . 2>/dev/null || true
            git pull origin main
            # Без --no-cache: он обнулял весь кэш слоёв, из-за чего npm ci
            # заново тянул зависимости на каждом деплое, даже когда
            # package-lock.json не менялся. Слой зависимостей теперь
            # инвалидируется самим Docker'ом по хэшу lock-файла
            docker compose build
            docker compose up -d
            # Multi-stage оставляет прежние builder-слои висеть без тега;
            # без очистки они копятся на диске VPS от деплоя к деплою
            docker image prune -f
