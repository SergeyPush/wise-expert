name: CI / Deploy

on:
  # Проверки на каждом PR в main и на push в main; деплой — только push в main
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Новый push в ту же ветку/PR отменяет устаревший прогон проверок,
# но деплой main не прерывается на середине
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Та же мажорная версия, что в Dockerfile (node:22-alpine)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # getStaticProps тянет данные из Contentful — без ключей сборка упадёт.
      # Lint уже прошёл отдельным шагом, в сборке его не повторяем
      - name: Build
        run: npx next build --no-lint
        env:
          NEXT_PUBLIC_CONTENTFUL_SPACE: ${{ secrets.CONTENTFUL_SPACE }}
          NEXT_PUBLIC_CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1

  deploy:
    # Деплой только после зелёных проверок и только для push в main
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git checkout -- . 2>/dev/null || true
            git pull origin main
            # Без --no-cache: он обнулял весь кэш слоёв, из-за чего npm ci
            # заново тянул зависимости на каждом деплое, даже когда
            # package-lock.json не менялся. Слой зависимостей теперь
            # инвалидируется самим Docker'ом по хэшу lock-файла
            docker compose build
            docker compose up -d
            # Multi-stage оставляет прежние builder-слои висеть без тега;
            # без очистки они копятся на диске VPS от деплоя к деплою
            docker image prune -f
            # Кэш сборки чистим по возрасту, а не целиком: на нём держится
            # ускорение деплоя, но без ограничения он растёт бесконечно —
            # к моменту ввода этого шага накопилось 15.19GB за 68 записей.
            # Неделя переживает паузы между деплоями, кэш остаётся тёплым
            docker builder prune -f --filter until=168h
