services:
  frontend:
    build:
      context: .
      # .env отдаётся сборке как secret, а не копируется в образ: ключи
      # Contentful нужны блогу в getStaticProps на этапе build, но лежать
      # в слое образа они не должны
      secrets:
        - env
    restart: unless-stopped
    # command не задаём: CMD образа запускает standalone-сервер (node server.js).
    # Прежний `npm run start` в standalone-образе не работает — там нет ни
    # package.json со скриптами, ни devDependencies.
    container_name: frontend
    # Рантайм-переменные (в т.ч. TELEGRAM_BOT_TOKEN для /api/submit)
    env_file:
      - .env
    # Только loopback: снаружи сайт доступен через nginx (443). Без 127.0.0.1
    # Docker публикует порт на всех интерфейсах в обход nginx и ufw — тогда
    # limit_req на /api/ не работает, а X-Real-IP можно подделать
    ports:
      - '127.0.0.1:3000:3000'

secrets:
  env:
    file: .env
