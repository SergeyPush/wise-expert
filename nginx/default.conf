# Прод-конфиг wisexpert.com.ua (копия /etc/nginx/sites-enabled/default.conf с 62.72.21.150)
# http2 включён 2026-08-21; сертификат LE покрывает apex + www

server {
    listen 80;
    listen [::]:80;
    server_name wisexpert.com.ua www.wisexpert.com.ua;

    return 301 https://wisexpert.com.ua$request_uri;
}

# Redirect www HTTPS → non-www HTTPS
server {
    listen 443 ssl http2;
    server_name www.wisexpert.com.ua;

    ssl_certificate /etc/letsencrypt/live/wisexpert.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wisexpert.com.ua/privkey.pem;

    return 301 https://wisexpert.com.ua$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wisexpert.com.ua;

    ssl_certificate /etc/letsencrypt/live/wisexpert.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wisexpert.com.ua/privkey.pem;

    # Заявки: не больше 1 запроса в секунду с IP, всплеск до 5 — дальше 429.
    # Зона limit объявлена в nginx.conf (limit_req_zone ... zone=limit rate=1r/s).
    # Второй рубеж — счётчик в самом роуте (app/api/[[...route]]/route.ts)
    location /api/ {
        limit_req zone=limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
